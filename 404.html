<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Page Not Found — Portfolio</title>
    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400&display=swap');
      body{background:#080808;color:#f0ede6;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;text-align:center;padding:24px}
      .dp{font-family:'Bebas Neue',sans-serif;letter-spacing:0.02em}
      @keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
      .num{font-size:clamp(120px,20vw,200px);line-height:1;color:#f5a623;animation:floatY 4s ease-in-out infinite;text-shadow:0 0 80px rgba(245,166,35,0.2)}
      h1{font-size:clamp(24px,4vw,40px);color:#f0ede6;margin:16px 0 12px}
      p{color:#888;font-size:16px;line-height:1.7;max-width:400px;margin:0 auto 36px;font-weight:300}
      a{display:inline-block;background:#f5a623;color:#000;padding:14px 36px;border-radius:4px;text-decoration:none;font-weight:500;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;transition:all 0.25s}
      a:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(245,166,35,0.4)}
    </style>
    <script>
      // GitHub Pages SPA redirect — preserve the URL then redirect to home
      sessionStorage.setItem('redirect', location.pathname + location.search);
    </script>
  </head>
  <body>
    <div>
      <div class="dp num">404</div>
      <h1 class="dp">Page Not Found</h1>
      <p>The page you're looking for doesn't exist or has been moved.</p>
      <a href="/video-portfolio/">← Back to Portfolio</a>
    </div>
  </body>
</html>
